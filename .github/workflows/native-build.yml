name: Native client (C++ / WinUI 3 / DirectX 10)

# Builds the native OpenNOW Windows client from native/ into a portable ZIP.
#
# Manual run: Actions tab -> Native client (C++ / WinUI 3 / DirectX 10)
#             -> Run workflow -> pick Debug or Release.
#
# Two cheap jobs run first on Linux and gate nothing: the Core protocol tests
# and a check that the generated files are in sync with the web client. They
# exist so a broken protocol change or a stale generated file is obvious next
# to the Windows log instead of buried in it.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options: [Release, Debug]
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
    paths:
      - "native/**"
      - ".github/workflows/native-build.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-build.yml"

permissions:
  contents: read

jobs:
  # ── Core protocol tests (Linux) ────────────────────────────────────────────
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build
        run: |
          set -euo pipefail
          cmake -S native/src/Core -B build/core -DOPENNOW_BUILD_TESTS=ON
          cmake --build build/core -j"$(nproc)"

      - name: Run tests
        run: ctest --test-dir build/core --output-on-failure

  # ── Generated-file drift check (Linux) ─────────────────────────────────────
  generators:
    name: Generated files in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The three generators read the web client's stylesheet, GraphQL queries
      # and locales. If a run changes a committed file, the native client has
      # drifted from the web client and should be regenerated.
      - name: Regenerate and diff
        run: |
          set -euo pipefail
          node native/tools/sync-design-tokens.mjs
          node native/tools/extract-graphql-queries.mjs
          node native/tools/sync-locales.mjs
          git config user.name "ci"
          git config user.email "ci@example.invalid"
          git add -A native/src/App/Themes/GeneratedTokens.xaml \
                     native/src/App/Strings \
                     native/src/Core/include/opennow/core/gfn/GeneratedQueries.inc
          git diff --cached --quiet || {
            echo "::error::Generated files are out of date. Run: npm run native:sync"
            git diff --cached --stat
            exit 1
          }

  # ── Windows x64 build ──────────────────────────────────────────────────────
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # Diagnostics only: which Windows SDK versions are actually on the image.
      # TargetPlatformVersion is "10.0" in both projects, so MSBuild picks the
      # newest installed SDK and this step records what that resolved to.
      - name: Report installed Windows SDKs
        shell: pwsh
        run: |
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name
          Write-Output "--- VC targets paths (vXXX is the MSBuild toolset dir) ---"
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\MSBuild\Microsoft\VC" -Directory -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
          Write-Output "--- MSVC toolsets ---"
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\MSVC" -Directory -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

      # A vcxproj that does not pin <PlatformToolset> takes the toolset that
      # matches $(VisualStudioVersion). MSBuild leaves that empty when it is
      # started outside a Developer Command Prompt, and the empty value falls
      # back to v100, which fails with MSB8020. vswhere says which Visual
      # Studio the image actually has.
      - name: Resolve Visual Studio version
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installed = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Workload.NativeDesktop -property installationVersion
          if (-not $installed) { $installed = '17.0' }
          $major = "$installed".Split('.')[0]
          Write-Output "vswhere installationVersion: $installed"
          Write-Output "VisualStudioVersion=$major.0" >> $env:GITHUB_ENV

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          & msbuild native\OpenNOW.sln /t:Restore `
            /p:Configuration="${{ inputs.configuration || 'Release' }}" `/p:Platform=x64 `
            /p:VisualStudioVersion=$env:VisualStudioVersion /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build OpenNOW
        shell: pwsh
        run: |
          $configuration = "${{ inputs.configuration || 'Release' }}"
          & msbuild native\OpenNOW.sln `
            /p:Configuration=$configuration /p:Platform=x64 `
            /p:VisualStudioVersion=$env:VisualStudioVersion `
            /verbosity:minimal `
            /flp:LogFile=native-build.log`;Verbosity=diagnostic 2>&1 | Out-File -FilePath native-build-stdout.log -Encoding utf8
          $code = $LASTEXITCODE
          Get-Content native-build-stdout.log -Tail 120

          if ($code -ne 0) {
            # Surface the compiler errors as workflow annotations: they show up
            # directly in the run summary, which is far quicker than digging
            # through the uploaded log on a failing build.
            $log = if (Test-Path native-build.log) { "native-build.log" } else { "native-build-stdout.log" }
            $errors = Select-String -Path $log -Pattern ' error [A-Z]+[0-9]+|: error |MSB[0-9]+:|fatal error' |
                      Select-Object -First 40
            foreach ($match in $errors) {
              $text = ($match.Line.Trim() -replace '\r','' -replace '\n',' ')
              if ($text.Length -gt 300) { $text = $text.Substring(0, 300) }
              Write-Output "::error::$text"
            }
            Write-Output "::error::msbuild exited with $code - full log is on the ci-buildlog branch and in the native-build-log artifact"
            exit $code
          }

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Recurse native\build\x64\${{ inputs.configuration || 'Release' }} -File | Select-Object -ExpandProperty FullName

      # Portable layout: the executable plus every DLL the Windows App SDK
      # copied next to it. Unpackaged WinUI 3 apps run from a plain folder.
      - name: Assemble portable build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $configuration = "${{ inputs.configuration || 'Release' }}"
          $out = "native\build\x64\$configuration"
          if (-not (Test-Path "$out\OpenNOW.App.exe")) {
            throw "OpenNOW.App.exe not found in $out"
          }
          $portable = "portable\OpenNOW-native"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item "$out\*" $portable -Recurse -Force
          Compress-Archive -Path $portable -DestinationPath "portable\OpenNOW-native-windows-x64.zip"
          Get-ChildItem -Recurse $portable -File | Select-Object -ExpandProperty Name

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: OpenNOW-native-windows-x64-portable
          path: portable/OpenNOW-native-windows-x64.zip
          if-no-files-found: error

      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: OpenNOW-native-windows-x64-exe
          path: native/build/x64/${{ inputs.configuration || 'Release' }}/OpenNOW.App.exe
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: |
            native-build.log
            native-build-stdout.log
          if-no-files-found: warn

      # Log downloads need a GitHub session or the artifact blob host, neither
      # of which every automation environment has. Pushing the log to an orphan
      # branch means plain `git fetch` can always read it.
      - name: Publish build log to the ci-buildlog branch
        if: failure()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-buildlog
          git rm -rf . >/dev/null 2>&1 || true
          for f in native-build.log native-build-stdout.log; do
            [ -f "$f" ] && cp "$f" "$(basename $f).txt" || true
          done
          git add -A
          git commit -q -m "build log for run $GITHUB_RUN_ID ($GITHUB_REF_NAME)"
          git push --force origin ci-buildlog

  # ── Rolling release ────────────────────────────────────────────────────────
  # Workflow artifacts expire and need a signed-in session; release assets are
  # permanent and give one stable download link per branch line.
  publish:
    name: Publish native build
    needs: [build-windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download portable build
        uses: actions/download-artifact@v4
        with:
          name: OpenNOW-native-windows-x64-portable
          path: staging/portable

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cp staging/portable/*.zip assets/OpenNOW-native-windows-x64.zip
          (cd assets && sha256sum OpenNOW-native-windows-x64.zip > SHA256SUMS.txt)
          ls -l assets && cat assets/SHA256SUMS.txt

      - name: Create or refresh the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          case "$ref" in
            v*)   tag="native-$ref"; prerelease="" ;;
            *)    tag="native-${ref//\//-}"; prerelease="--prerelease" ;;
          esac
          notes="Automated native (C++/WinUI 3) build of ${ref} at $(git rev-parse --short HEAD).
          
          Unpack the archive and run OpenNOW.App.exe. Requires Windows 10 1809+ and a DirectX 10 capable GPU."
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" assets/* --title "OpenNOW native ${ref}" --notes "$notes" $prerelease
