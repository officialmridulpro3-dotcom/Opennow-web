name: Native client (C++ / WinUI 3 / DirectX 10)

# Builds the native OpenNOW Windows client from native/ into a portable ZIP.
#
# Manual run: Actions tab -> Native client (C++ / WinUI 3 / DirectX 10)
#             -> Run workflow -> pick Debug or Release.
#
# Two cheap jobs run first on Linux and gate nothing: the Core protocol tests
# and a check that the generated files are in sync with the web client. They
# exist so a broken protocol change or a stale generated file is obvious next
# to the Windows log instead of buried in it.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options: [Release, Debug]
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
    paths:
      - "native/**"
      - ".github/workflows/native-build.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-build.yml"

permissions:
  contents: read

jobs:
  # ── Core protocol tests (Linux) ────────────────────────────────────────────
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build
        run: |
          set -euo pipefail
          cmake -S native/src/Core -B build/core -DOPENNOW_BUILD_TESTS=ON
          cmake --build build/core -j"$(nproc)"

      - name: Run tests
        run: ctest --test-dir build/core --output-on-failure

  # ── Generated-file drift check (Linux) ─────────────────────────────────────
  generators:
    name: Generated files in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The three generators read the web client's stylesheet, GraphQL queries
      # and locales. If a run changes a committed file, the native client has
      # drifted from the web client and should be regenerated.
      - name: Regenerate and diff
        run: |
          set -euo pipefail
          node native/tools/sync-design-tokens.mjs
          node native/tools/extract-graphql-queries.mjs
          node native/tools/sync-locales.mjs
          git config user.name "ci"
          git config user.email "ci@example.invalid"
          git add -A native/src/App/Themes/GeneratedTokens.xaml \
                     native/src/App/Strings \
                     native/src/Core/include/opennow/core/gfn/GeneratedQueries.inc
          git diff --cached --quiet || {
            echo "::error::Generated files are out of date. Run: npm run native:sync"
            git diff --cached --stat
            exit 1
          }

  # ── Windows x64 build ──────────────────────────────────────────────────────
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # Diagnostics only: which Windows SDK versions are actually on the image.
      # TargetPlatformVersion is "10.0" in both projects, so MSBuild picks the
      # newest installed SDK and this step records what that resolved to.
      - name: Report installed Windows SDKs
        shell: pwsh
        run: |
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name
          Write-Output "--- VC targets paths (vXXX is the MSBuild toolset dir) ---"
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\MSBuild\Microsoft\VC" -Directory -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
          Write-Output "--- MSVC toolsets ---"
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\MSVC" -Directory -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

      # A vcxproj that does not pin <PlatformToolset> takes the toolset that
      # matches $(VisualStudioVersion). MSBuild leaves that empty outside a
      # Developer Command Prompt and then falls back to v100, which fails with
      # MSB8020. There is no stable "latest" value, so read the toolset table
      # out of the Microsoft.Cpp.Default.props that is actually installed and
      # pass the result explicitly.
      - name: Resolve MSVC platform toolset
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installed = if (Test-Path $vswhere) { (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Workload.NativeDesktop -property installationVersion) -join '' } else { '' }
          $vsInstall = if (Test-Path $vswhere) { (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Workload.NativeDesktop -property installationPath) -join '' } else { '' }
          if (-not $vsInstall) {
            $vsInstall = (Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Directory -ErrorAction SilentlyContinue |
                          Select-Object -First 1).FullName
          }
          $major = if ($installed) { "$installed".Split('.')[0] } else { '' }

          $toolset = ''
          $props = Get-ChildItem (Join-Path $vsInstall 'MSBuild\Microsoft\VC\v*\Microsoft.Cpp.Default.props') -ErrorAction SilentlyContinue |
                   Sort-Object FullName -Descending | Select-Object -First 1
          if ($props -and $major) {
            foreach ($line in Get-Content $props.FullName) {
              if (($line -match 'DefaultPlatformToolset') -and ($line -match "'$major.0'") -and ($line -match '(v[0-9]+)')) {
                $toolset = $matches[1]
                break
              }
            }
          }
          if (-not $toolset) {
            # No table entry: fall back to the newest toolset directory that
            # ships with this Visual Studio.
            $toolset = (Get-ChildItem (Join-Path $vsInstall 'MSBuild\Microsoft\VC\*\Platforms\x64\PlatformToolsets\*') -Directory -ErrorAction SilentlyContinue |
                        Where-Object { $_.Name -match '^v[0-9]+$' } |
                        Sort-Object Name -Descending | Select-Object -First 1).Name
          }
          if (-not $toolset) { $toolset = 'v143' }

          @(
            "vswhere            : $vswhere"
            "installationVersion: $installed"
            "installationPath   : $vsInstall"
            "visualStudioMajor  : $major"
            "propsFile          : $($props.FullName)"
            "platformToolset    : $toolset"
            "--- DefaultPlatformToolset table ---"
            $(if ($props) { (Select-String -Path $props.FullName -Pattern 'DefaultPlatformToolset' | Select-Object -ExpandProperty Line) -join "`n" })
            "--- toolset directories ---"
            $((Get-ChildItem (Join-Path $vsInstall 'MSBuild\Microsoft\VC\*\Platforms\x64\PlatformToolsets\*') -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName) -join "`n")
          ) | Out-File -FilePath toolchain.txt -Encoding utf8

          Write-Output "OPENNOW_PLATFORMTOOLSET=$toolset" >> $env:GITHUB_ENV

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          & msbuild native\OpenNOW.sln /t:Restore `
            /p:Configuration="${{ inputs.configuration || 'Release' }}" /p:Platform=x64 `
            /p:PlatformToolset=$env:OPENNOW_PLATFORMTOOLSET /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build OpenNOW
        shell: pwsh
        run: |
          $configuration = "${{ inputs.configuration || 'Release' }}"
          & msbuild native\OpenNOW.sln `
            /p:Configuration=$configuration /p:Platform=x64 `
            /p:PlatformToolset=$env:OPENNOW_PLATFORMTOOLSET `
            /verbosity:normal `
            /flp:LogFile=native-build.log`;Verbosity=diagnostic 2>&1 | Out-File -FilePath native-build-stdout.log -Encoding utf8
          $code = $LASTEXITCODE
          Get-Content native-build-stdout.log -Tail 120

          if ($code -ne 0) {
            # Surface the compiler errors as workflow annotations: they show up
            # directly in the run summary, which is far quicker than digging
            # through the uploaded log on a failing build.
            $log = if (Test-Path native-build.log) { "native-build.log" } else { "native-build-stdout.log" }
            $errors = Select-String -Path $log -Pattern ' error [A-Z]+[0-9]+|: error |MSB[0-9]+:|fatal error' |
                      Select-Object -First 40
            foreach ($match in $errors) {
              $text = ($match.Line.Trim() -replace '\r','' -replace '\n',' ')
              if ($text.Length -gt 300) { $text = $text.Substring(0, 300) }
              Write-Output "::error::$text"
            }
            Write-Output "::error::msbuild exited with $code - full log is on the ci-buildlog branch and in the native-build-log artifact"
            exit $code
          }

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Recurse native\build\x64\${{ inputs.configuration || 'Release' }} -File | Select-Object -ExpandProperty FullName

      # Portable layout: the executable plus every DLL the Windows App SDK
      # copied next to it. Unpackaged WinUI 3 apps run from a plain folder.
      - name: Assemble portable build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $configuration = "${{ inputs.configuration || 'Release' }}"
          $out = "native\build\x64\$configuration"
          if (-not (Test-Path "$out\OpenNOW.App.exe")) {
            throw "OpenNOW.App.exe not found in $out"
          }
          $portable = "portable\OpenNOW-native"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item "$out\*" $portable -Recurse -Force
          Compress-Archive -Path $portable -DestinationPath "portable\OpenNOW-native-windows-x64.zip"
          Get-ChildItem -Recurse $portable -File | Select-Object -ExpandProperty Name

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: OpenNOW-native-windows-x64-portable
          path: portable/OpenNOW-native-windows-x64.zip
          if-no-files-found: error

      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: OpenNOW-native-windows-x64-exe
          path: native/build/x64/${{ inputs.configuration || 'Release' }}/OpenNOW.App.exe
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: |
            native-build.log
            native-build-stdout.log
            toolchain.txt
          if-no-files-found: warn

      # Two unknowns decide how the remaining compile errors get fixed: where
      # cppwinrt writes the generated header for an .idl in a subfolder, and
      # which generated file declares InitializeComponent. Dump the tree and
      # grep it, guarded, so an empty result cannot abort the step.
      - name: Diagnose the XAML pipeline
        if: always()
        shell: pwsh
        run: |
          & msbuild native\src\App\OpenNOW.App.vcxproj /pp:pp.xml /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 | Out-Null
          if (Test-Path pp.xml) {
            $lines = @(Get-Content -Path pp.xml)
            $cur = ''
            $hits = @()
            for ($i = 0; $i -lt $lines.Count; $i++) {
              $l = $lines[$i]
              if ($l -match '<Import Project="(.+?)"') { $cur = $matches[1] }
              if ($l -match 'Target Name="(MarkupCompilePass1|MarkupCompilePass2|CompileXamlGeneratedFiles|XamlPreCompile|MarkupCompilePass1UpdateCodeBehind)"' -or $l -match 'XamlLanguage' -or $l -match 'Microsoft.UI.Xaml.Markup.Compiler') {
                $hits += "$($i+1) [$cur] $($l.Trim())"
              }
            }
            "preprocessed file: $($lines.Count) lines" | Out-File -FilePath xaml-pipeline.txt -Encoding utf8
            Add-Content -Path xaml-pipeline.txt -Value (@($hits) -join "`n")
          }
          $interop = Get-ChildItem -Path (Join-Path $env:USERPROFILE '.nuget\packages\microsoft.windowsappsdk') -Recurse -Filter 'Microsoft.UI.Xaml.Markup.Compiler.interop.targets' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -ne $interop) {
            Add-Content -Path xaml-pipeline.txt -Value "===== $($interop.FullName) lines 1-120 ====="
            Add-Content -Path xaml-pipeline.txt -Value ((@(Get-Content $interop.FullName -TotalCount 120)) -join "`n")
            Add-Content -Path xaml-pipeline.txt -Value "===== targets defined in it ====="
            Add-Content -Path xaml-pipeline.txt -Value ((@(Get-Content $interop.FullName | Select-String -Pattern 'Target Name=' -SimpleMatch | ForEach-Object { $_.Line.Trim() })) -join "`n")
          }

      - name: Dump generated file tree
        if: always()
        shell: pwsh
        run: |
          $out  = @()
          $files = @(Get-ChildItem -Path native\obj -Recurse -File -ErrorAction SilentlyContinue)
          $out += '--- every file under native\obj ---'
          $out += ($files.FullName -join "`n")
          $out += '--- grep InitializeComponent in generated sources ---'
          $targets = @($files | Where-Object { $_.Name -match '\.(g\.h|g\.hpp|g\.cpp|h|hpp|cpp)$' })
          if ($targets.Count -gt 0) {
            $hits = @(Select-String -Path $targets.FullName -Pattern 'InitializeComponent' -List -ErrorAction SilentlyContinue)
            foreach ($hit in $hits) { $out += ($hit.Path + ' :: ' + $hit.Line.Trim()) }
          }
          $out += '--- xaml compiler targets mentioning cppwinrt / language ---'
          $pkgs = Join-Path $env:USERPROFILE '.nuget\packages'
          $files = @(Get-ChildItem -Path $pkgs -Recurse -File -Include '*.targets','*.props' -ErrorAction SilentlyContinue |
                     Where-Object { $_.Name -match 'Xaml|Markup|WinUI|AppSDK' })
          $out += (@($files | Select-Object -ExpandProperty FullName) -join "`n")
          foreach ($f in $files) {
            $hits = @(Select-String -Path $f.FullName -Pattern 'CppWinRT|XamlLanguage|CompileAsWinRT|CodeGen.*Cpp|C\+\+/CX' -ErrorAction SilentlyContinue)
            if ($hits.Count -gt 0) {
              $out += "===== $($f.FullName) ====="
              $out += (@($hits | ForEach-Object { "$($_.LineNumber): $($_.Line.Trim())" }) -join "`n")
            }
          }
          $out += '--- head of the markup generated App.g.h ---'
          $app = 'native\obj\OpenNOW.App\x64\Release\Generated Files\App.g.h'
          if (Test-Path $app) { $out += (@(Get-Content $app -TotalCount 40) -join "`n") }
          $out += '--- markup compiler output in the source tree ---'
          $out += (@(Get-ChildItem -Path native\src\App\Generated Files -Recurse -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName) -join "`n")
          $out += '--- xbf files anywhere in the workspace ---'
          $out += (@(Get-ChildItem -Path . -Recurse -Filter *.xbf -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName) -join "`n")
          $out += '--- content of every App.g.* ---'
          foreach ($g in @($files | Where-Object { $_.Name -like 'App.g.*' })) {
            $out += ('===== ' + $g.FullName)
            $out += @(Get-Content $g.FullName -TotalCount 30 -ErrorAction SilentlyContinue)
          }
          ($out -join "`n") | Out-File -FilePath generated.txt -Encoding utf8
          Write-Output ("generated.txt: " + (Get-Item generated.txt).Length + " bytes")

      # Log downloads need a GitHub session or the artifact blob host, and a
      # plain "push the log to an orphan branch" step can fail on its own and
      # leave last run's log in place. Publish through the contents API and fall
      # back to git, and stamp the run id so a stale branch is obvious.
      - name: Publish build report to the ci-buildlog branch
        if: always()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'

          $report = @()
          if (Test-Path toolchain.txt) { $report += @(Get-Content toolchain.txt -ErrorAction SilentlyContinue) }
          $report += '--- errors ---'
          $log = @('native-build-stdout.log', 'native-build.log') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($log) {
            $report += @(Select-String -Path $log -Pattern 'error [A-Z]+[0-9]+|: error |MSB[0-9]+:|fatal error' -ErrorAction SilentlyContinue |
                         ForEach-Object { $_.Line } | Sort-Object -Unique | Select-Object -First 80)
          }
          ($report -join "`n") | Out-File -FilePath ci-report.txt -Encoding utf8

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept        = 'application/vnd.github+json'
            'User-Agent'  = 'opennow-ci'
          }
          function Publish-File([string]$source, [string]$target) {
            if (-not (Test-Path $source)) { Write-Output "skip (absent): $source"; return }
            $bytes   = [IO.File]::ReadAllBytes($source)
            $content = [Convert]::ToBase64String($bytes)
            $uri     = 'https://api.github.com/repos/' + $env:GITHUB_REPOSITORY + '/contents/' + $target + '?ref=ci-buildlog'
            $sha     = $null
            try { $sha = (Invoke-RestMethod -Headers $headers -Uri $uri -ErrorAction Stop).sha } catch { }
            $payload = @{ message = 'CI report for run ' + $env:GITHUB_RUN_ID; content = $content }
            if ($sha) { $payload['sha'] = $sha }
            try {
              Invoke-RestMethod -Method Put -Headers $headers -Uri $uri -ContentType 'application/json' `
                -Body (ConvertTo-Json $payload -Depth 5) -ErrorAction Stop | Out-Null
              Write-Output ('published ' + $target + ' (' + $bytes.Length + ' bytes)')
            } catch {
              Write-Output ('publish FAILED for ' + $target + ': ' + $_.Exception.Message)
            }
          }

          Publish-File 'ci-report.txt'  'ci-report.txt'
          Publish-File 'generated.txt'  'generated.txt'
          Publish-File 'xaml-pipeline.txt' 'xaml-pipeline.txt'

          try {
            git config user.name  'ci' | Out-Null
            git config user.email 'ci@users.noreply.github.com' | Out-Null
            git checkout --orphan ci-buildlog 2>&1 | Out-Null
            git rm -rf . 2>&1 | Out-Null
            New-Item -ItemType Directory -Force -Path logs | Out-Null
            foreach ($pair in @(@('native-build-stdout.log', 'stdout.log'),
                                @('toolchain.txt', 'toolchain.txt'),
                                @('ci-report.txt', 'ci-report.txt'),
                                @('generated.txt', 'generated.txt'),
                                @('xaml-pipeline.txt', 'xaml-pipeline.txt'))) {
              if (Test-Path $pair[0]) { Copy-Item $pair[0] ('logs/' + $pair[1]) -Force }
            }
            Set-Content -Path logs/RUN.txt -Value ("run $env:GITHUB_RUN_ID`n$(Get-Date -Format o)")
            git add -A logs 2>&1 | Out-Null
            git commit -q -m "build log for run $env:GITHUB_RUN_ID ($env:GITHUB_REF_NAME)" 2>&1 | Out-Null
            git push --force origin ci-buildlog 2>&1 | Out-Null
            Write-Output 'git fallback published logs/'
          } catch {
            Write-Output ('git publish failed: ' + $_.Exception.Message)
          }

  # ── Rolling release ────────────────────────────────────────────────────────
  # Workflow artifacts expire and need a signed-in session; release assets are
  # permanent and give one stable download link per branch line.
  publish:
    name: Publish native build
    needs: [build-windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download portable build
        uses: actions/download-artifact@v4
        with:
          name: OpenNOW-native-windows-x64-portable
          path: staging/portable

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cp staging/portable/*.zip assets/OpenNOW-native-windows-x64.zip
          (cd assets && sha256sum OpenNOW-native-windows-x64.zip > SHA256SUMS.txt)
          ls -l assets && cat assets/SHA256SUMS.txt

      - name: Create or refresh the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          case "$ref" in
            v*)   tag="native-$ref"; prerelease="" ;;
            *)    tag="native-${ref//\//-}"; prerelease="--prerelease" ;;
          esac
          notes="Automated native (C++/WinUI 3) build of ${ref} at $(git rev-parse --short HEAD).
          
          Unpack the archive and run OpenNOW.App.exe. Requires Windows 10 1809+ and a DirectX 10 capable GPU."
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" assets/* --title "OpenNOW native ${ref}" --notes "$notes" $prerelease
