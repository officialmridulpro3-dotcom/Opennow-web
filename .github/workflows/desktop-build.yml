name: Desktop build (Windows)

# Builds the native OpenNOW desktop app (Tauri 2 shell + bundled backend +
# WebView2 client) into a Windows x64 NSIS installer and a portable ZIP.
#
# Manual run: Actions tab -> Desktop build (Windows) -> Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]

jobs:
  windows:
    name: Build Windows x64
    needs: [nvst-sidecar]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The native streaming engine is built once in nvst-sidecar; rename it
      # into the externalBin lookup slot so the bundler (installer) and the
      # portable layout below pick it up as opennow-nvst. desktop:prepare sees
      # the staged file and skips its redundant local rebuild.
      - name: Download NVST sidecar
        uses: actions/download-artifact@v4
        with:
          name: opennow-nvst-sidecar-windows-x64
          path: nvst-sidecar

      - name: Stage NVST sidecar for bundling
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          Copy-Item "nvst-sidecar/opennow-streamer.exe" "src-tauri/binaries/opennow-nvst-x86_64-pc-windows-msvc.exe"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      # The same chain tauri.conf.json runs locally via beforeBuildCommand,
      # split out here so failures pinpoint the right stage.
      - name: Build client and backend bundle
        run: |
          npm run build
          npm run desktop:prepare

      # Compiles the Rust shell and packages the NSIS installer. The wrapper
      # script republishes error lines as annotations and tees the full output
      # to tauri-build.log so failures are readable from the API without raw
      # logs. CARGO_TERM_COLOR=never keeps output parseable.
      - name: Build OpenNOW desktop app
        env:
          CARGO_TERM_COLOR: never
        run: node scripts/ci-tauri-build.mjs -- --config src-tauri/tauri.ci.conf.json

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenNOW-windows-x64-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Portable variant: everything the app needs beside the executable.
      # The Rust shell resolves server.mjs, dist/, and the opennow-server
      # sidecar relative to the exe directory when they are not in a resource
      # directory, so this layout runs without installation.
      - name: Assemble portable build
        shell: pwsh
        run: |
          $portable = "portable/OpenNOW"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item "src-tauri/target/release/opennow.exe" "$portable/OpenNOW.exe"
          Copy-Item "src-tauri/resources/server.mjs" $portable
          Copy-Item "src-tauri/binaries/opennow-server-x86_64-pc-windows-msvc.exe" $portable
          Copy-Item "src-tauri/binaries/opennow-nvst-x86_64-pc-windows-msvc.exe" $portable
          Copy-Item -Recurse "dist" "$portable/dist"
          Compress-Archive -Path $portable -DestinationPath "portable/OpenNOW-portable-windows-x64.zip"

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: OpenNOW-windows-x64-portable
          path: portable/OpenNOW-portable-windows-x64.zip
          if-no-files-found: error

  # Phase 1 of docs/NATIVE_STREAMER.md: compile upstream's native NVST engine
  # (vendored at third_party/opennow-streamer) as a standalone Windows binary
  # and smoke-test its JSON-lines handshake. Not yet wired into the app.
  nvst-sidecar:
    name: Build NVST sidecar (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/opennow-streamer

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # *-sys crates (ffmpeg, opus) run bindgen, which needs libclang.
      - name: Install LLVM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install llvm -y --no-progress
          $llvmBin = Join-Path $env:ProgramFiles "LLVM\bin"
          if (-not (Test-Path (Join-Path $llvmBin "clang.exe")) -or -not (Test-Path (Join-Path $llvmBin "libclang.dll"))) {
            throw "LLVM installation is missing libclang.dll"
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build opennow-nvst sidecar
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
        run: cargo build --locked --release --manifest-path third_party/opennow-streamer/Cargo.toml -p opennow-streamer

      - name: Smoke test (hello handshake)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "third_party/opennow-streamer/target/release/opennow-streamer.exe"
          if (-not (Test-Path $exe)) { throw "sidecar binary missing: $exe" }
          $reply = '{"id":"smoke-1","type":"hello","protocolVersion":7}', '{"id":"smoke-2","type":"shutdown","reason":"smoke done"}' | & $exe 2>nvst-smoke-stderr.log | Out-String
          Write-Host $reply
          if ($LASTEXITCODE -ne 0) { throw "sidecar exited with code $LASTEXITCODE" }
          if ($reply -notmatch '"type"\s*:\s*"ready"') { throw "sidecar did not answer hello with ready" }

      - name: Upload NVST sidecar
        uses: actions/upload-artifact@v4
        with:
          name: opennow-nvst-sidecar-windows-x64
          path: third_party/opennow-streamer/target/release/opennow-streamer.exe
          if-no-files-found: error
