[package]
name = "opennow"
version = "0.1.0"
description = "OpenNOW — native desktop client for GeForce NOW"
authors = ["OpenCloudGaming"]
license = "MIT"
repository = "https://github.com/Gmaafdh/Opennow-web"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
raw-window-handle = "0.6"
# Overlay window IPC payloads and the commands' events are plain JSON values.
serde_json = "1"

[profile.release]
# Small, fast desktop shell: the heavy lifting lives in WebView2 and the
# bundled backend, so optimize the host binary for size and startup.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
